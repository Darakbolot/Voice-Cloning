<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Offline MMS Speech Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="page-title text-center mb-4">Offline MMS Speech Assistant</h2>

    <div class="row justify-content-center">
        <div class="col-md-6 text-center">
            <button id="recordBtn" class="btn btn-primary">Rekam</button>
            <div id="status" class="mt-3"></div>
        </div>
    </div>

    <div class="row justify-content-center mt-4">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body">
                    <h5>Transkrip</h5>
                    <textarea id="transcript" class="form-control" rows="4" readonly></textarea>

                    <h5 class="mt-3">Hasil TTS</h5>
                    <audio id="audioPlayer" controls class="w-100"></audio>

                    <div class="d-flex justify-content-between mt-3">
                        <div id="errorMsg" class="text-danger"></div>
                        <div>
                            <a id="downloadBtn" href="/download_output" class="btn btn-outline-secondary" download>
                                Download WAV
                            </a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
